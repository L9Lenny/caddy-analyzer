<!-- ===== SECURITY SHIELD BADGE (on chest) ===== -->
<g transform="translate(118, 175)">
	<path d="M0,0 L22,8 L22,30 L11,40 L0,30 Z" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
	<text x="11" y="25" font-family="monospace" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="bold">✓</text>
</g>

<!-- ===== TERMINAL SCREEN (in front of gopher, bottom) ===== -->
<g transform="translate(35, 215)">
	<!-- Terminal body -->
	<rect x="0" y="0" width="210" height="75" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
	<!-- Title bar -->
