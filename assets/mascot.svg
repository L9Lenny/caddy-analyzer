<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <rect width="400" height="520" fill="#ffffff"/>

  <!-- ===== OMBRA A TERRA ===== -->
  <ellipse cx="200" cy="495" rx="90" ry="12" fill="#e0e0e0"/>

  <!-- ===== CORPO (forma a pera/goccia - stretto sopra, largo sotto) ===== -->
  <path d="M200 280
           C 150 280, 125 320, 125 380
           C 125 440, 155 480, 200 480
           C 245 480, 275 440, 275 380
           C 275 320, 250 280, 200 280 Z"
        fill="#7DA8B0"/>

  <!-- Pancia chiara -->
  <path d="M200 310
           C 170 310, 155 340, 155 380
           C 155 425, 175 455, 200 455
           C 225 455, 245 425, 245 380
           C 245 340, 230 310, 200 310 Z"
        fill="#A8C8CE"/>

  <!-- ===== ZAMPE (corte e tozze) ===== -->
  <!-- Zampa sinistra -->
  <path d="M140 440 Q120 450 115 470 Q113 482 125 485 Q138 485 142 475 Q145 460 150 450 Z" fill="#7DA8B0"/>
  <ellipse cx="128" cy="478" rx="16" ry="10" fill="#6A959C"/>
  <!-- Zampa destra -->
  <path d="M260 440 Q280 450 285 470 Q287 482 275 485 Q262 485 258 475 Q255 460 250 450 Z" fill="#7DA8B0"/>
  <ellipse cx="272" cy="478" rx="16" ry="10" fill="#6A959C"/>

  <!-- ===== BRACCIA (corte, lungo il corpo) ===== -->
  <!-- Braccio sinistro -->
  <path d="M140 350 Q120 370 118 395 Q117 405 127 408 Q137 408 140 398 Q145 380 152 365 Z" fill="#7DA8B0"/>
  <ellipse cx="125" cy="400" rx="14" ry="11" fill="#6A959C"/>
  <!-- Braccio destro (regge terminale) -->
  <path d="M260 350 Q285 365 290 390 Q291 402 281 405 Q271 405 268 395 Q263 378 255 365 Z" fill="#7DA8B0"/>
  <ellipse cx="278" cy="398" rx="14" ry="11" fill="#6A959C"/>

  <!-- ===== TESTA (larga e schiacciata - stile gopher) ===== -->
  <path d="M200 100
           C 130 100, 95 145, 95 185
           C 95 220, 130 250, 200 250
           C 270 250, 305 220, 305 185
           C 305 145, 270 100, 200 100 Z"
        fill="#7DA8B0"/>

  <!-- ===== ORECCHIE (piccole e arrotondate in cima) ===== -->
  <ellipse cx="145" cy="108" rx="20" ry="16" fill="#6A959C"/>
  <ellipse cx="145" cy="110" rx="10" ry="8" fill="#D8A8A0"/>
  <ellipse cx="255" cy="108" rx="20" ry="16" fill="#6A959C"/>
  <ellipse cx="255" cy="110" rx="10" ry="8" fill="#D8A8A0"/>

  <!-- ===== MUSO (area sporgente chiara) ===== -->
  <path d="M200 165
           C 165 165, 150 190, 150 210
           C 150 230, 170 245, 200 245
           C 230 245, 250 230, 250 210
           C 250 190, 235 165, 200 165 Z"
        fill="#F2E2D0"/>

  <!-- ===== OCCHI (piccoli, ravvicinati, puntini neri) ===== -->
  <ellipse cx="180" cy="170" rx="7" ry="9" fill="#1a1a1a"/>
  <ellipse cx="220" cy="170" rx="7" ry="9" fill="#1a1a1a"/>
  <circle cx="182" cy="167" r="2.5" fill="#ffffff"/>
  <circle cx="222" cy="167" r="2.5" fill="#ffffff"/>

  <!-- ===== NASO (piccolo, rosa) ===== -->
  <ellipse cx="200" cy="200" rx="6" ry="4.5" fill="#4a4a4a"/>
  <ellipse cx="198" cy="198" rx="2" ry="1.5" fill="#6a6a6a"/>

  <!-- ===== BOCCA ===== -->
  <path d="M178 218 Q200 232 222 218" fill="none" stroke="#5a5a5a" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== DENTI (due incisivi) ===== -->
  <path d="M191 218 L191 232 Q191 235 194 235 L197 235 Q200 235 200 232 L200 218 Z" fill="#ffffff" stroke="#d0d0d0" stroke-width="0.5"/>
  <path d="M200 218 L200 232 Q200 235 203 235 L206 235 Q209 235 209 232 L209 218 Z" fill="#ffffff" stroke="#d0d0d0" stroke-width="0.5"/>

  <!-- ===== GUANCE ===== -->
  <ellipse cx="145" cy="205" rx="18" ry="12" fill="#F5C8C0" opacity="0.3"/>
  <ellipse cx="255" cy="205" rx="18" ry="12" fill="#F5C8C0" opacity="0.3"/>

  <!-- ===== TERMINALE (sopra la pancia, retto dalla zampa destra) ===== -->
  <g transform="translate(225, 370)">
    <rect x="0" y="0" width="140" height="90" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <!-- Title bar -->
    <path d="M0 6 Q0 0 6 0 L134 0 Q140 0 140 6 L140 18 L0 18 Z" fill="#161b22"/>
    <circle cx="10" cy="9" r="3" fill="#ff5f56"/>
    <circle cx="20" cy="9" r="3" fill="#ffbd2e"/>
    <circle cx="30" cy="9" r="3" fill="#27c93f"/>
    <!-- Output -->
    <text x="8" y="34" font-family="monospace" font-size="8" fill="#58a6ff">~/logs</text>
    <text x="8" y="46" font-family="monospace" font-size="8" fill="#3fb950">$ caddy-analyze</text>
    <text x="8" y="58" font-family="monospace" font-size="7" fill="#8b949e">  14,832 entries</text>
    <text x="8" y="70" font-family="monospace" font-size="7" fill="#f85149">  3 threats ✓</text>
    <rect x="8" y="76" width="5" height="9" fill="#3fb950">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== SHIELD (sul corpo, piccolo) ===== -->
  <g transform="translate(186, 330)">
    <path d="M0 0 L14 5 L14 18 L7 24 L0 18 Z" fill="#1a1a2e" stroke="#3fb950" stroke-width="1.5"/>
    <text x="7" y="16" font-family="monospace" font-size="10" fill="#3fb950" text-anchor="middle" font-weight="bold">✓</text>
  </g>

</svg>
