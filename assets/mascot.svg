<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <rect width="400" height="480" fill="#ffffff"/>

  <!-- ===== TERMINALE (sotto) ===== -->
  <rect x="40" y="270" width="320" height="195" rx="12" fill="#0d1117"/>
  <rect x="40" y="270" width="320" height="195" rx="12" fill="none" stroke="#21262d" stroke-width="2"/>

  <!-- Title bar -->
  <path d="M40 282 Q40 270 52 270 L348 270 Q360 270 360 282 L360 298 L40 298 Z" fill="#161b22"/>
  <line x1="40" y1="298" x2="360" y2="298" stroke="#21262d" stroke-width="1"/>
  <circle cx="60" cy="284" r="5" fill="#ff5f56"/>
  <circle cx="76" cy="284" r="5" fill="#ffbd2e"/>
  <circle cx="92" cy="284" r="5" fill="#27c93f"/>
  <text x="200" y="288" font-family="monospace" font-size="11" fill="#6a737d" text-anchor="middle">caddy-analyzer — zsh</text>

  <!-- Output righe -->
  <text x="60" y="322" font-family="monospace" font-size="12" fill="#58a6ff">~/logs</text>
  <text x="60" y="340" font-family="monospace" font-size="12" fill="#3fb950">$ caddy-analyze --detect</text>
  <text x="60" y="358" font-family="monospace" font-size="10" fill="#8b949e">  Scanning 14,832 entries...</text>
  <text x="60" y="376" font-family="monospace" font-size="10" fill="#3fb950">  ✓ Clean        12,401</text>
  <text x="60" y="392" font-family="monospace" font-size="10" fill="#f85149">  ✗ Suspicious     1,204</text>
  <text x="60" y="408" font-family="monospace" font-size="10" fill="#d29922">  ⚠ Bots           1,227</text>
  <text x="60" y="428" font-family="monospace" font-size="12" fill="#3fb950">  3 threats blocked ✓</text>
  <rect x="60" y="438" width="7" height="13" fill="#3fb950" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== ORECCHIE ===== -->
  <ellipse cx="138" cy="88" rx="22" ry="20" fill="#7AAAB2"/>
  <ellipse cx="138" cy="90" rx="12" ry="11" fill="#E8C0B0"/>
  <ellipse cx="262" cy="88" rx="22" ry="20" fill="#7AAAB2"/>
  <ellipse cx="262" cy="90" rx="12" ry="11" fill="#E8C0B0"/>

  <!-- ===== TESTA (enorme, stile Go gopher) ===== -->
  <ellipse cx="200" cy="160" rx="105" ry="92" fill="#8BB8C0"/>

  <!-- Ombra sotto la testa (dove incontra il terminale) -->
  <ellipse cx="200" cy="248" rx="95" ry="18" fill="#7AAAB2" opacity="0.5"/>

  <!-- ===== MUSO (area chiara sporgente) ===== -->
  <ellipse cx="200" cy="208" rx="48" ry="38" fill="#F0E0D0"/>

  <!-- ===== OCCHI (piccoli puntini neri - stile Go gopher) ===== -->
  <ellipse cx="172" cy="148" rx="6.5" ry="8.5" fill="#1a1a1a"/>
  <ellipse cx="228" cy="148" rx="6.5" ry="8.5" fill="#1a1a1a"/>
  <circle cx="174" cy="145" r="2" fill="#ffffff"/>
  <circle cx="230" cy="145" r="2" fill="#ffffff"/>

  <!-- Sopracciglio sinistro (subtle) -->
  <path d="M162 132 Q172 128 182 132" fill="none" stroke="#5a8a92" stroke-width="2" stroke-linecap="round"/>
  <!-- Sopracciglio destro -->
  <path d="M218 132 Q228 128 238 132" fill="none" stroke="#5a8a92" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== NASO ===== -->
  <ellipse cx="200" cy="190" rx="7" ry="5" fill="#4a4a4a"/>
  <ellipse cx="198" cy="188" rx="2" ry="1.5" fill="#6a6a6a"/>

  <!-- ===== BOCCA ===== -->
  <path d="M183 210 Q200 220 217 210" fill="none" stroke="#6a6a6a" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ===== DENTI (due incisivi bianchi) ===== -->
  <rect x="193" y="202" width="6" height="10" rx="1.5" fill="#ffffff" stroke="#d0d0d0" stroke-width="0.5"/>
  <rect x="201" y="202" width="6" height="10" rx="1.5" fill="#ffffff" stroke="#d0d0d0" stroke-width="0.5"/>

  <!-- ===== GUANCE (arrossore sottile) ===== -->
  <ellipse cx="140" cy="188" rx="16" ry="10" fill="#F5C8C0" opacity="0.35"/>
  <ellipse cx="260" cy="188" rx="16" ry="10" fill="#F5C8C0" opacity="0.35"/>

  <!-- ===== ZAMPETTE (poggiate sul bordo del terminale) ===== -->
  <!-- Zampa sinistra -->
  <ellipse cx="120" cy="268" rx="26" ry="16" fill="#8BB8C0"/>
  <ellipse cx="120" cy="264" rx="17" ry="10" fill="#F0E0D0"/>
  <!-- Dita sinistra -->
  <line x1="108" y1="272" x2="106" y2="278" stroke="#6a8a90" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120" y1="274" x2="120" y2="280" stroke="#6a8a90" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="132" y1="272" x2="134" y2="278" stroke="#6a8a90" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Zampa destra -->
  <ellipse cx="280" cy="268" rx="26" ry="16" fill="#8BB8C0"/>
  <ellipse cx="280" cy="264" rx="17" ry="10" fill="#F0E0D0"/>
  <!-- Dita destra -->
  <line x1="268" y1="272" x2="266" y2="278" stroke="#6a8a90" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="280" y1="274" x2="280" y2="280" stroke="#6a8a90" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="292" y1="272" x2="294" y2="278" stroke="#6a8a90" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ===== SHIELD piccolo sulla testa (badge sicurezza) ===== -->
  <g transform="translate(250, 85)">
    <path d="M0 0 L14 5 L14 16 L7 22 L0 16 Z" fill="#1a1a2e" stroke="#3fb950" stroke-width="1.5"/>
    <text x="7" y="15" font-family="monospace" font-size="9" fill="#3fb950" text-anchor="middle" font-weight="bold">✓</text>
  </g>

</svg>
