	<!-- Output lines -->
	<text x="10" y="36" font-family="monospace" font-size="9" fill="#58a6ff">~/logs</text>
	<text x="10" y="50" font-family="monospace" font-size="9" fill="#3fb950">$ caddy-analyze --detect</text>
	<text x="10" y="64" font-family="monospace" font-size="8" fill="#f85149">3 threats blocked ✓</text>

	<!-- Blinking cursor -->
	<rect x="120" y="56" width="6" height="10" fill="#3fb950">
		<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
	</rect>
</g>

